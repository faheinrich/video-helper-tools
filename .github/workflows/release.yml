name: Release
# Tags archive-v<version> and analysis-v<version> build and publish one app each.
on:
  push:
    tags: ["archive-v*", "analysis-v*"]
  workflow_dispatch:   # manual test run: builds the chosen app and keeps it as download, but publishes nothing
    inputs:
      app:
        description: App to build
        type: choice
        options: [archive-helper, analysis-helper]
        default: archive-helper

# One run per tag (and per app for manual runs); a second run for the same tag waits instead of racing the first.
concurrency:
  group: release-${{ github.ref }}-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.meta.outputs.app }}
      title: ${{ steps.meta.outputs.title }}
      file: ${{ steps.meta.outputs.file }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            case "$GITHUB_REF_NAME" in
              archive-v*)  app=archive-helper;  version="${GITHUB_REF_NAME#archive-v}" ;;
              analysis-v*) app=analysis-helper; version="${GITHUB_REF_NAME#analysis-v}" ;;
            esac
            declared=$(grep -m1 '^version' "$app/pyproject.toml" | sed -E 's/.*"(.*)".*/\1/')
            if [[ "$declared" != "$version" ]]; then
              echo "Tag version $version does not match $app/pyproject.toml ($declared)" >&2
              exit 1
            fi
          else
            app="${{ inputs.app }}"
          fi
          case "$app" in
            archive-helper)  title="Archive Helper";  file="Archive-Helper" ;;
            analysis-helper) title="Analysis Helper"; file="Analysis-Helper" ;;
          esac
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS-silicon
          - os: ubuntu-24.04   # fixed: on ubuntu-latest (now Ubuntu 26) installing the Qt libraries failed
            label: Linux-x64
          - os: windows-latest
            label: Windows-x64
    runs-on: ${{ matrix.os }}
    env:
      APP: ${{ needs.meta.outputs.app }}
      TITLE: ${{ needs.meta.outputs.title }}
      FILE: ${{ needs.meta.outputs.file }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Qt libraries (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 12
        run: .github/scripts/linux_deps.sh   # not plain apt: its mirrors at times hang for many minutes
      - name: Build the app
        shell: bash
        run: bash "$APP/build.sh"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent "$APP/dist/$TITLE.app" "$FILE-${{ matrix.label }}.zip"
          echo "PACKAGE=$FILE-${{ matrix.label }}.zip" >> "$GITHUB_ENV"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -czf "$FILE-${{ matrix.label }}.tar.gz" -C "$APP/dist" "$TITLE"
          echo "PACKAGE=$FILE-${{ matrix.label }}.tar.gz" >> "$GITHUB_ENV"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:APP/dist/$env:TITLE" -DestinationPath "$env:FILE-${{ matrix.label }}.zip"
          "PACKAGE=$env:FILE-${{ matrix.label }}.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Package size
        shell: bash
        run: ls -lh "$PACKAGE"
      # archive: false uploads the package itself. Otherwise GitHub wraps it in another zip on download, and macOS's
      # Archive Utility fails to open the zip inside that zip. The artifact is named after the file.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.PACKAGE }}
          archive: false
          retention-days: 14

  release:
    # Manual runs go through the same steps up to the publishing, so the download and the file check are tested
    # before a tag is pushed.
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
          skip-decompress: true   # the packages are zip files themselves and must stay zip files
      - name: Check the packages
        run: |
          ls -l packages
          test "$(ls packages | wc -l)" -eq 3
          ls packages | grep -q "macOS-silicon.zip$"
          ls packages | grep -q "Linux-x64.tar.gz$"
          ls packages | grep -q "Windows-x64.zip$"
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ needs.meta.outputs.title }}
        run: |
          notes="Unsigned builds. macOS: Apple Silicon (M1 or later) only; on first start macOS blocks the app: open System Settings > Privacy & Security and choose Open Anyway (right-click > Open no longer works on macOS 15 and later). Windows: SmartScreen shows a warning, choose More info, Run anyway."
          if [[ "${{ needs.meta.outputs.app }}" == "archive-helper" ]]; then
            notes="$notes Requires ffmpeg and exiftool (macOS: brew install ffmpeg exiftool)."
          else
            notes="$notes Requires ffmpeg (macOS: brew install ffmpeg)."
          fi
          # A second run for the same tag (it happened once) must not fail on the release that already exists.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" --title "$TITLE ${GITHUB_REF_NAME#*-v}" \
              --generate-notes --notes "$notes"
          fi
