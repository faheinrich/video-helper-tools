name: Tests
on:
  push:
    branches: ["**"]   # not for tags: a release tag points at a commit that was tested already
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]   # Linux fixed: ubuntu-latest moved to Ubuntu 26
        package: [video-helper-core, archive-helper, analysis-helper]
        include:   # adds the folder (and how many test processes) to the combinations of the same package
          - {package: video-helper-core, dir: core, workers: auto}
          - {package: archive-helper, dir: archive-helper, workers: auto}
          # Analysis Helper for now as before: one process, no Windows. In parallel its tests at times hung
          # (Linux, Windows) or crashed; to be looked into.
          - {package: analysis-helper, dir: analysis-helper, workers: "0"}
        exclude:
          - {os: windows-latest, package: analysis-helper}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Not from apt: its mirrors at times hang for many minutes (see the script).
      - name: Install ffmpeg (Linux, Windows)
        id: ffmpeg
        if: runner.os != 'macOS'
        continue-on-error: true   # a download that breaks off once is tried again below
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          github-token: ${{ github.server_url == 'https://github.com' && github.token || '' }}
      - name: Install ffmpeg, second try (Linux, Windows)
        if: runner.os != 'macOS' && steps.ffmpeg.outcome == 'failure'
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          github-token: ${{ github.server_url == 'https://github.com' && github.token || '' }}
      - name: Install exiftool and Qt's libraries (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 12
        run: .github/scripts/linux_deps.sh --exiftool
      - name: Install exiftool (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: choco install exiftool -y --no-progress
      - name: Install ffmpeg and exiftool (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: brew install ffmpeg exiftool
      # Only this package's dependencies (the archive app does not need PyTorch).
      - run: uv sync --package ${{ matrix.package }} --group dev
      - name: Run tests with coverage
        working-directory: ${{ matrix.dir }}
        # below the job's limit, so that a hang fails only this step and the annotations below still show why
        timeout-minutes: 28
        shell: bash
        run: |
          set -o pipefail
          uv run --package ${{ matrix.package }} pytest -n ${{ matrix.workers }} --junitxml=junit.xml --cov --cov-report=term-missing \
            --cov-report=xml --cov-report=html 2>&1 | tee pytest.log
        env:
          QT_QPA_PLATFORM: offscreen
      # The run's logs need a login to read; annotations do not, so the reasons of a failure are put there.
      - name: Failures as annotations
        if: failure()
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: python ../.github/scripts/annotate_failures.py junit.xml pytest.log
      - name: Coverage summary
        if: always()
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: uv run --package ${{ matrix.package }} coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
      - uses: codecov/codecov-action@v5
        if: runner.os == 'Linux' && always()
        with:
          files: ${{ matrix.dir }}/coverage.xml
          flags: ${{ matrix.package }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.package }}-${{ matrix.os }}
          path: ${{ matrix.dir }}/htmlcov
