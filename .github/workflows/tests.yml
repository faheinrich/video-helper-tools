name: Tests
on:
  push:
    branches: ["**"]   # not for tags: a release tag points at a commit that was tested already
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]   # Linux fixed: ubuntu-latest moved to Ubuntu 26
        package: [video-helper-core, archive-helper, analysis-helper]
        include:   # adds the folder to the combinations of the same package
          - {package: video-helper-core, dir: core}
          - {package: archive-helper, dir: archive-helper}
          - {package: analysis-helper, dir: analysis-helper}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Not from apt: its mirrors at times hang for many minutes (see the script).
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          github-token: ${{ github.server_url == 'https://github.com' && github.token || '' }}
      - name: Install exiftool and Qt's libraries (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 12
        run: .github/scripts/linux_deps.sh --exiftool
      - name: Install ffmpeg and exiftool (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: brew install ffmpeg exiftool
      # Only this package's dependencies (the archive app does not need PyTorch).
      - run: uv sync --package ${{ matrix.package }} --group dev
      # Names every library Qt cannot find on Linux at once (as annotations), instead of one per failed run.
      - name: Libraries Qt cannot find (Linux)
        if: runner.os == 'Linux'
        run: |
          find .venv -path "*PySide6*" -name "*.so*" -exec ldd {} \; 2>/dev/null | grep "not found" | sort -u \
            | sed 's/^\s*/::warning title=Missing library::/' || true
      - name: Run tests with coverage
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: |
          set -o pipefail
          uv run --package ${{ matrix.package }} pytest --junitxml=junit.xml --cov --cov-report=term-missing \
            --cov-report=xml --cov-report=html 2>&1 | tee pytest.log
        env:
          QT_QPA_PLATFORM: offscreen
      # The run's logs need a login to read; annotations do not, so the reasons of a failure are put there.
      - name: Failures as annotations
        if: failure()
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: python ../.github/scripts/annotate_failures.py junit.xml pytest.log
      - name: Coverage summary
        if: always()
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: uv run --package ${{ matrix.package }} coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
      - uses: codecov/codecov-action@v5
        if: runner.os == 'Linux' && always()
        with:
          files: ${{ matrix.dir }}/coverage.xml
          flags: ${{ matrix.package }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.package }}-${{ matrix.os }}
          path: ${{ matrix.dir }}/htmlcov
