[project]
name = "analysis-helper"
version = "0.0.3"
description = "Desktop app for synchronising videos by their audio and transcribing them with Whisper."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "video-helper-core",
    "PySide6>=6.10",
    "numpy",
    "matplotlib",
    "librosa",
    "opencv-python",
    "requests",
    "tqdm",
    "pympi-ling",
    "silero-vad[onnx-cpu]",
    "torch",
    "transformers",
    "fastapi",
    "uvicorn",
    "pydantic",
]

[project.scripts]
run-whisper-server = "analysis_helper.transcriber.run_minimal_whisper_server:main"
annotate-to-elan = "analysis_helper.transcriber.transcribe_video_to_elan:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analysis_helper"]

[dependency-groups]
dev = [
    "pyinstaller",
    "pillow",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout",
]

[tool.pytest.ini_options]
# A hanging test (seen once on Linux CI) fails with a stack trace instead of stalling the whole run.
timeout = 300
timeout_method = "thread"
# pytest-timeout's thread needs the GIL; a hang inside Qt that holds it (seen on Linux CI) never ends that way.
# faulthandler's watchdog is plain C: it prints every thread's stack and ends the process.
faulthandler_timeout = 330
faulthandler_exit_on_timeout = true
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["analysis_helper"]
branch = true
omit = [
    "*/transcriber/run_minimal_whisper_server.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

# Linux: the default torch wheel pulls in CUDA (several GB); the app only needs the CPU build.
[tool.uv.sources]
video-helper-core = { workspace = true }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
