[project]
name = "archive-helper"
version = "0.0.4"
description = "Desktop app for compressing videos for the archive (HEVC, metadata kept) and backing up folders with rsync."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["video-helper-core", "PySide6>=6.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["archive_helper"]

[dependency-groups]
dev = ["pyinstaller", "pillow", "pytest>=9.1.1", "pytest-cov>=7.1.0", "pytest-timeout"]

[tool.uv.sources]
video-helper-core = { workspace = true }

[tool.pytest.ini_options]
# A hanging test (seen once on Linux CI) fails with a stack trace instead of stalling the whole run.
timeout = 300
timeout_method = "thread"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["archive_helper"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
