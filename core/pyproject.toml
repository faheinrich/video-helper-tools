[project]
name = "video-helper-core"
version = "0.0.1"
description = "Shared parts of the Video Helper apps: window shell, translations, styles, app data paths."
requires-python = ">=3.12"
dependencies = ["PySide6>=6.10", "certifi"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["video_helper_core"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout",
]

[tool.pytest.ini_options]
# A hanging test (seen once on Linux CI) fails with a stack trace instead of stalling the whole run.
timeout = 300
timeout_method = "thread"
# pytest-timeout's thread needs the GIL; a hang inside Qt that holds it (seen on Linux CI) never ends that way.
# faulthandler's watchdog is plain C: it prints every thread's stack and ends the process.
faulthandler_timeout = 330
faulthandler_exit_on_timeout = true
testpaths = ["tests"]

[tool.coverage.run]
source = ["video_helper_core"]
branch = true
omit = ["*/testing.py"]
