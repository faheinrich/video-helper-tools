[project]
name = "video-helper-core"
version = "0.0.1"
description = "Shared parts of the Video Helper apps: window shell, translations, styles, app data paths."
requires-python = ">=3.12"
dependencies = ["PySide6>=6.10", "certifi"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["video_helper_core"]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "pytest-timeout"]

[tool.pytest.ini_options]
# A hanging test (seen once on Linux CI) fails with a stack trace instead of stalling the whole run.
timeout = 300
timeout_method = "thread"
testpaths = ["tests"]

[tool.coverage.run]
source = ["video_helper_core"]
branch = true
omit = ["*/testing.py"]
